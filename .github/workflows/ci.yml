name: CI

on:
  pull_request:
  # Also after merging, so anything that reached main without a PR is checked too.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-messages:
    # Commits are credited to people only (AGENTS.md, Git workflow): no AI co-author or
    # "Generated with" lines, whatever tool wrote the code.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No AI attribution in commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(co-authored-by:.*(claude|anthropic|copilot|cursor|codex|openai|chatgpt|gemini|devin|aider)|.*generated with \[?(claude|copilot|cursor))'
          if git log --format='%h %B' "$BASE..$HEAD" | grep -inE "$pattern"; then
            echo "::error::Remove AI attribution from these commit messages (AGENTS.md, Git workflow)."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same engine as Supabase, so migrations are checked against real Postgres.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rafael
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rafael
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: npm ci

      - name: API types match the backend
        run: |
          npm run api:generate
          git diff --exit-code src/api/core/schema.d.ts

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    # Whole journeys in a real browser: the real API on a throwaway SQLite database
    # (backend/tests/e2e/server.py) and the real frontend.
    # Pinned: Playwright 1.56 can't install its browser on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          npm ci
          cd ../backend && uv sync --locked

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
